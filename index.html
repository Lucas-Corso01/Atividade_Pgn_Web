<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscreva-se - Spotify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <img src="logo.png" alt="Spotify" class="logo">
  </header>

  <main class="caixa-cadastro">
    <h1>Se inscreva e comece a curtir!</h1>

    <div class="formulario-cadastro">
      <label for="email">Endereço de e-mail</label>
      <input type="email" id="email" name="email" placeholder="nome@exemplo.com">

      <a href="atualizando.html" class="botao-principal">Avançar</a>
    </div>

    <div class="divisor">ou</div>

    <div class="botoes-sociais">
      <a href="atualizando.html" class="botao-contorno">Inscrever-se com seu número de telefone</a>
      <a href="atualizando.html" class="botao-contorno">Inscrever-se com o Google</a>
      <a href="atualizando.html" class="botao-contorno">Criar conta com a Apple</a>
    </div>

    <p class="link-login">Já tem uma conta? <a href="atualizando.html">Entrar</a></p>
  </main>

</body>
</html>
