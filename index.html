<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Inscreva-se - Spotify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <img src="logo.png" alt="Spotify" class="logo">
  </header>

  <main class="caixa-cadastro">
    <h1>Se inscreva e comece a curtir!</h1>

    <form class="formulario-cadastro">
      <label for="email">Endereço de e-mail</label>
      <input type="email" id="email" placeholder="nome@exemplo.com">

      <button type="submit" class="botao-principal">Avançar</button>
    </form>

    <div class="divisor">ou</div>

    <div class="botoes-sociais">
      <button class="botao-contorno">Inscrever-se com seu número de telefone</button>
      <button class="botao-contorno">Inscrever-se com o Google</button>
      <button class="botao-contorno">Criar conta com a Apple</button>
    </div>

    <p class="link-login">Já tem uma conta? <a href="#">Entrar</a></p>
  </main>

</body>
</html>
